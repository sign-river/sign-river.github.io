# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
favicon = "/favicon.png"

# ========== 博客自定义参数 ==========
[blog_params.article_card]
# 左上角标签最大显示数量（分类 + tags 总共）
max_tags = 3
# 分类标签和 tags 标签之间的间距（像素值，如 "8px", "12px"）
tag_separator_margin = "0px"

[blog_params.homepage]
# 每页显示的文章数量
posts_per_page = 10
# 是否显示文章摘要
show_summary = true

# 首页内容丰富度筛选（0-100 分）
# 分数 = 正文字数得分（最高 70）+ 配图得分（最高 30）
[blog_params.homepage.content_richness]
enabled = true
minimum_score = 60
word_target = 600
word_weight = 70
image_weight = 10
image_limit = 3

[blog_params.sidebar]
# 显示的分类数量限制
categories_limit = 10
# 显示的标签数量限制
tags_limit = 15

[blog_params.article_page]
# 是否显示阅读时间
show_reading_time = true
# 是否显示发布日期
show_publish_date = true
# 相关文章显示数量
related_posts_limit = 5


[footer]
since = 2021
customText = "Powered by YSY"

[dateFormat]
published = "Jan 02, 2006"
lastUpdated = "Jan 02, 2006 15:04 MST"

[sidebar]
title = "YSY"
emoji = "😺"
subtitle = "热爱编程"

[sidebar.avatar]
enabled = true
local = true
src = "img/avatar.webp"  # 使用 WebP 格式，加载更快（从 6MB 优化到 19KB）

## Social Links
[[sociallinks]]
name = "GitHub"
url = "https://github.com/sign-river"

[[sociallinks]]
name = "Bilibili"
url = "https://space.bilibili.com/504574253"

[article]
headingAnchor = false
math = false
readingTime = true

[article.license]
enabled = true
default = "Licensed under CC BY-NC-SA 4.0"

